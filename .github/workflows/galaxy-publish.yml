# Ansible Galaxy Publishing Workflow
# Automatically publishes collection to Ansible Galaxy on version tag pushes
# See ADR-0012 for CI/CD strategy

---
name: Publish to Ansible Galaxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write  # For creating GitHub releases
  actions: read    # For checking workflow status

jobs:
  build:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate version consistency
        run: |
          # Extract version from git tag (e.g., v1.0.1 -> 1.0.1)
          if [[ "${{ github.ref }}" =~ ^refs/tags/v(.+)$ ]]; then
            TAG_VERSION="${BASH_REMATCH[1]}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_VERSION="${{ github.event.inputs.version }}"
          else
            echo "❌ ERROR: Unable to determine version from tag or input"
            exit 1
          fi

          # Extract version from galaxy.yml
          GALAXY_VERSION=$(grep '^version:' galaxy.yml | awk '{print $2}' | tr -d '"' | tr -d "'")

          # Compare versions
          echo "🏷️  Git tag version: $TAG_VERSION"
          echo "📦 galaxy.yml version: $GALAXY_VERSION"

          if [[ "$TAG_VERSION" != "$GALAXY_VERSION" ]]; then
            echo ""
            echo "❌ ERROR: Version mismatch detected!"
            echo ""
            echo "The git tag version ($TAG_VERSION) does not match the galaxy.yml version ($GALAXY_VERSION)"
            echo ""
            echo "To fix this issue:"
            echo "1. Update the version in galaxy.yml to match the tag: $TAG_VERSION"
            echo "2. Commit the change: git add galaxy.yml && git commit -m 'chore: Bump version to $TAG_VERSION'"
            echo "3. Delete the existing tag: git tag -d v$TAG_VERSION && git push origin :refs/tags/v$TAG_VERSION"
            echo "4. Push the commit: git push"
            echo "5. Re-create the tag: git tag -a v$TAG_VERSION -m 'Release v$TAG_VERSION' && git push origin v$TAG_VERSION"
            echo ""
            exit 1
          fi

          echo "✅ Version validation passed: $TAG_VERSION"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core>=2.15

      - name: Build collection
        run: |
          ansible-galaxy collection build

      - name: Upload collection artifact
        uses: actions/upload-artifact@v5
        with:
          name: collection
          path: "*.tar.gz"
          retention-days: 30

  publish:
    name: Publish to Galaxy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ansible-galaxy
      url: https://galaxy.ansible.com/ui/repo/published/tosin2013/mcp_audit/
    steps:
      - name: Download collection artifact
        uses: actions/download-artifact@v7
        with:
          name: collection

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core>=2.15

      - name: Publish to Galaxy
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish *.tar.gz --api-key="$ANSIBLE_GALAXY_API_KEY"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
