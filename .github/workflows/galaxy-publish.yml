# Ansible Galaxy Publishing Workflow
# Automatically publishes collection to Ansible Galaxy on version tag pushes
# See ADR-0012 for CI/CD strategy

---
name: Publish to Ansible Galaxy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  contents: write  # For creating GitHub releases
  actions: read    # For checking workflow status

jobs:
  build:
    name: Build Collection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core>=2.15

      - name: Build collection
        run: |
          ansible-galaxy collection build

      - name: Upload collection artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection
          path: mcp-audit-*.tar.gz
          retention-days: 30

  publish:
    name: Publish to Galaxy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ansible-galaxy
      url: https://galaxy.ansible.com/ui/repo/published/mcp/audit/
    steps:
      - name: Download collection artifact
        uses: actions/download-artifact@v4
        with:
          name: collection

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core>=2.15

      - name: Publish to Galaxy
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API_KEY }}
        run: |
          ansible-galaxy collection publish mcp-audit-*.tar.gz --api-key="$ANSIBLE_GALAXY_API_KEY"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: mcp-audit-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
