# Ansible Sanity Tests Workflow
# See ADR-0012 for CI/CD strategy
# See ADR-0013 for version compatibility matrix

---
name: Ansible Sanity Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  sanity:
    name: Sanity (Py${{ matrix.python-version }} + ansible-core ${{ matrix.ansible-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test matrix: 7 valid combinations (explicit include to avoid incompatible versions)
        # ansible-core 2.16+ requires Python >=3.10
        include:
          # Python 3.9 - only ansible-core 2.15 (2.16+ require Python >=3.10)
          - python-version: '3.9'
            ansible-version: '2.15'

          # Python 3.11 - all ansible-core versions
          - python-version: '3.11'
            ansible-version: '2.15'
          - python-version: '3.11'
            ansible-version: '2.16'
          - python-version: '3.11'
            ansible-version: '2.17'

          # Python 3.13 - all ansible-core versions
          - python-version: '3.13'
            ansible-version: '2.15'
          - python-version: '3.13'
            ansible-version: '2.16'
          - python-version: '3.13'
            ansible-version: '2.17'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          path: ansible_collections/mcp/audit

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ansible-core ${{ matrix.ansible-version }}
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core~=${{ matrix.ansible-version }}.0

      - name: Install collection dependencies
        working-directory: ansible_collections/mcp/audit
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run ansible-test sanity
        working-directory: ansible_collections/mcp/audit
        run: |
          ansible-test sanity --python ${{ matrix.python-version }} --docker default
        continue-on-error: ${{ matrix.python-version == '3.13' }}  # Allow 3.13 to fail initially
