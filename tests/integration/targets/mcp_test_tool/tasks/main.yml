---
# SPDX-License-Identifier: GPL-3.0-or-later
# Integration tests for mcp_test_tool module

- name: Test add tool
  mcp.audit.mcp_test_tool:
    server_command: "{{ ansible_python_interpreter }}"
    server_args:
      - "{{ playbook_dir }}/../sample_servers/calculator/server.py"
    transport: "stdio"
    tool_name: "add"
    tool_arguments:
      a: 5
      b: 3
  register: add_result

- name: Verify add result
  ansible.builtin.assert:
    that:
      - add_result.success
      - add_result.result is defined
      - add_result.result | string == "8"
    fail_msg: "Add tool test failed: {{ add_result }}"

- name: Test calculate_product tool
  mcp.audit.mcp_test_tool:
    server_command: "{{ ansible_python_interpreter }}"
    server_args:
      - "{{ playbook_dir }}/../sample_servers/calculator/server.py"
    transport: "stdio"
    tool_name: "calculate_product"
    tool_arguments:
      a: 4
      b: 7
  register: product_result

- name: Verify product result
  ansible.builtin.assert:
    that:
      - product_result.success
      - product_result.result is defined
      - product_result.result | string == "28"
    fail_msg: "Product tool test failed: {{ product_result }}"

- name: Test get_server_info tool
  mcp.audit.mcp_test_tool:
    server_command: "{{ ansible_python_interpreter }}"
    server_args:
      - "{{ playbook_dir }}/../sample_servers/calculator/server.py"
    transport: "stdio"
    tool_name: "get_server_info"
    tool_arguments: {}
  register: server_info_result

- name: Verify server info result
  ansible.builtin.assert:
    that:
      - server_info_result.success
      - server_info_result.result is defined
    fail_msg: "Server info tool test failed: {{ server_info_result }}"

- name: Test tool with expected result validation
  mcp.audit.mcp_test_tool:
    server_command: "{{ ansible_python_interpreter }}"
    server_args:
      - "{{ playbook_dir }}/../sample_servers/calculator/server.py"
    transport: "stdio"
    tool_name: "calculate_sum"
    tool_arguments:
      a: 10
      b: 20
    expected_result: "30"
  register: expected_result_test

- name: Verify expected result validation
  ansible.builtin.assert:
    that:
      - expected_result_test.success
      - expected_result_test.validation.passed
    fail_msg: "Expected result validation failed: {{ expected_result_test }}"

- name: Test invalid tool (should fail gracefully)
  mcp.audit.mcp_test_tool:
    server_command: "{{ ansible_python_interpreter }}"
    server_args:
      - "{{ playbook_dir }}/../sample_servers/calculator/server.py"
    transport: "stdio"
    tool_name: "nonexistent_tool"
    tool_arguments: {}
  register: invalid_tool_result
  ignore_errors: true

- name: Verify invalid tool handling
  ansible.builtin.assert:
    that:
      - invalid_tool_result.failed
    fail_msg: "Invalid tool should have failed"

- name: Display test results
  ansible.builtin.debug:
    msg:
      - "Add: 5 + 3 = {{ add_result.result }}"
      - "Product: 4 * 7 = {{ product_result.result }}"
      - "Expected result validation: {{ expected_result_test.validation.passed }}"
